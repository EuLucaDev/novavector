[package]
name = "novavector-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NovaVector tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
novavector-geom = { workspace = true }
novavector-color = { workspace = true }
novavector-doc = { workspace = true }
novavector-pathops = { workspace = true }
novavector-effects = { workspace = true }
novavector-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
novavector-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
